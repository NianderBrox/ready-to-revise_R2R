[project]
name = "machine-learning"
version = "0.1.0"
description = "Recall-probability prediction and revision-ranking service for Ready-to-Revise (training + FastAPI inference)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fsrs>=6.3.2",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
